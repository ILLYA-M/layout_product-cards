<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wdth,wght@0,75..100,100..900;1,75..100,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
  </head>
  <!-- #endregion -->

  <body class="body">
    <div
      class="card"
      data-qa="card"
    >
      <div class="picture">
        <img
          class="picture__image"
          src="./images/imac.jpeg"
          alt="iMac"
        />
      </div>
      <div class="botton">
        <div class="text text__name">
          APPLE A1419 iMac 27" Retina
          <br />
          5K Monoblock (MNED2UA/A)
        </div>
        <div class="text text__code">Product code: 195434</div>

        <div class="reviews stars stars--4">
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="text text__reviews">Reviews: 5</div>
        </div>
        <div class="text text__price">
          <p class="text textpricetext">Price:</p>
          <p class="text textpricenumber">$2,199</p>
        </div>
        <div class="button">
          <a
            href="#"
            class="button__buy"
            data-qa="hover"
          >
            BUY
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
